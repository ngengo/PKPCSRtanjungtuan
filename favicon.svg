<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <!-- Background circle -->
  <circle cx="32" cy="32" r="32" fill="#0a2014"/>

  <!-- Sea waves -->
  <ellipse cx="32" cy="52" rx="22" ry="5" fill="#1a5c3a" opacity="0.6"/>

  <!-- Lighthouse body -->
  <rect x="26" y="28" width="12" height="20" rx="2" fill="#f5f0e8"/>
  <!-- Stripe -->
  <rect x="26" y="34" width="12" height="4" fill="#c0392b"/>
  <rect x="26" y="42" width="12" height="4" fill="#c0392b"/>

  <!-- Lighthouse top / lantern room -->
  <rect x="24" y="22" width="16" height="8" rx="1" fill="#e8e0cc"/>
  <!-- Light glow -->
  <circle cx="32" cy="26" r="4" fill="#f9e04b" opacity="0.9"/>
  <circle cx="32" cy="26" r="6" fill="#f9e04b" opacity="0.25"/>

  <!-- Roof cap -->
  <polygon points="32,14 22,22 42,22" fill="#2c3e50"/>

  <!-- Flag on top -->
  <line x1="32" y1="14" x2="32" y2="9" stroke="#ccc" stroke-width="1.2"/>
  <polygon points="32,9 38,11 32,13" fill="#c0392b"/>

  <!-- Base platform -->
  <rect x="22" y="48" width="20" height="4" rx="1" fill="#a0896a"/>

  <!-- Light rays -->
  <line x1="32" y1="26" x2="12" y2="18" stroke="#f9e04b" stroke-width="1.2" opacity="0.5"/>
  <line x1="32" y1="26" x2="52" y2="18" stroke="#f9e04b" stroke-width="1.2" opacity="0.5"/>
  <line x1="32" y1="26" x2="8" y2="26" stroke="#f9e04b" stroke-width="1" opacity="0.3"/>
</svg>
